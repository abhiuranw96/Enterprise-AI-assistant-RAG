services:
  backend:
    image: lakda/enterprise-ai-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    image: lakda/enterprise-ai-frontend:latest
    ports:
      - "8501:8501"
    environment:
      - ENTERPRISE_AI_API_URL=http://backend:8000
    depends_on:
      - backend
